name: Validate registry
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - run: node -e "const x=require('./plugins.json'); if(x.schemaVersion!==1||!Array.isArray(x.plugins)) process.exit(1); console.log('validated '+x.plugins.length+' plugins')"

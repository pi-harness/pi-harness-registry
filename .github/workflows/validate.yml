name: Validate registry
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - run: npx --yes ajv-cli@5 validate -s schema.json -d plugins.json --spec=draft2020
      - run: node validate.mjs
      - name: Detect npm metadata drift
        run: |
          cp plugins.json /tmp/plugins.before.json
          npm run sync:npm
          cmp -s plugins.json /tmp/plugins.before.json || { echo "Catalog drift detected; run npm run sync:npm and commit the result."; exit 1; } # "const x=require('./plugins.json'); if(x.schemaVersion!==1||!Array.isArray(x.plugins)) process.exit(1); console.log('validated '+x.plugins.length+' plugins')"
